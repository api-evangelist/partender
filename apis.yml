aid: partender
name: Partender
description: >-
  Partender is a bar and beverage inventory management platform that lets
  hospitality operators complete a full physical liquor, wine, beer, and keg
  inventory in roughly fifteen minutes by tap-and-swipe estimating how full each
  bottle is, at up to 99.2% accuracy. The subscription SaaS spans iOS, Android,
  and web apps and adds online ordering, purchase orders auto-sorted by
  distributor, pour-cost and variance reporting, and lightweight accounting so
  venues can cut time, labor, and inventory loss. Founded in 2012 and backed by
  500 Global, Partender serves bars, restaurants, hotels, and stadiums. This
  profile is maintained in the API Evangelist network; Partender exposes a
  consumer mobile/web product rather than a publicly documented developer API.
